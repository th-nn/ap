<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0f0f13;color:#e8e8f0;min-height:100vh}
.header{background:#1a1a24;border-bottom:1px solid #2a2a3a;padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.logo{width:32px;height:32px;background:linear-gradient(135deg,#f7971e,#ffd200);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#1a1a00;flex-shrink:0}

.badge{font-size:12px;background:#2a2a3a;color:#8888aa;padding:3px 10px;border-radius:20px;white-space:nowrap}

.stats-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:12px;color:#44445a}

.result-card.expanded{border-color:#f7971e;background:#1c1c2c}

.copy-btn{position:absolute;top:12px;right:12px;background:transparent;border:1px solid #2a2a3a;color:#44446a;padding:3px 9px;border-radius:6px;font-size:11px;cursor:pointer;transition:all 0.15s}
.copy-btn:hover{border-color:#f7971e;color:#ffd27a}

<script>
const questions = [{"idx": 1, "q": "Алдын алудың қандай түрлерін білесіз?", "answer": "Алдын алудың екі түрі бар: белсенді (активті) және пассивті профилактика. Белсенді — жабдықты үнемі тексеру және тазалау, пассивті — қорғаныш жабдықтарын орнату."}, {"idx": 2, "q": "Белсенді профилактиканың пассивтен айырмашылығы неде?", "answer": "Белсенді профилактика — жабдықты жүйелі түрде тексеріп, тазалап, реттеу. Пассивті профилактика — шаңнан қорғайтын сүзгілер, UPS, тұрақтандырғыштар орнату арқылы жабдықты қорғау."}, {"idx": 3, "q": "Мониторды қалай тазартуға болады?", "answer": "Мониторды арнайы микрофибра матамен немесе монитор экрандарына арналған тазартқыш сұйықтықпен сүртуге болады. Алдымен қуатты өшіру керек."}, {"idx": 4, "q": "Неліктен мониторды алкогольмен тазалауға болмайды?", "answer": "Алкоголь экранның антибликтік және антистатикалық қабатын бүлдіреді, нәтижесінде экранда дақтар мен зақымдар пайда болады."}, {"idx": 5, "q": "Жүйелік блокты қалай тазартуға болады?", "answer": "Жүйелік блокты тазалау үшін компрессорлы ауа немесе шаңсорғыш пайдаланылады. Ішіндегі шаңды, әсіресе желдеткіш пен радиатордан тазалау маңызды."}, {"idx": 6, "q": "Перифериялық құрылғыларды қалай тазартуға болады?", "answer": "Перифериялық құрылғыларды (пернетақта, тышқан) сығылған ауамен үрлеп, дымқыл матамен сүртуге болады. Пернетақтаны аударып шаңын қағуға болады."}, {"idx": 7, "q": "Компьютердің ластану көзі не болуы мүмкін?", "answer": "Компьютердің ластану көздері: шаң, кір, тамақ қалдықтары, жануарлар жүні, темекі түтіні. Бұлар желдеткіштерді бітеп, қызып кетуге әкеледі."}, {"idx": 8, "q": "ДК қандай тәртіппен құрастырылады?", "answer": "ДК құрастыру тәртібі: корпусты дайындау → аналық платаны орнату → процессор мен салқындатқыш → жедел жады → қуат блогы → дискілер → кабельдерді қосу."}, {"idx": 9, "q": "ДК бөлшектеу қандай тәртіппен жүзеге асырылады?", "answer": "ДК бөлшектеу кері тәртіппен жүзеге асырылады: кабельдерді ажырату → дискілерді алу → карталарды алу → жедел жады → салқындатқыш → процессор → аналық плата."}, {"idx": 10, "q": "ДК құрастыру және бөлшектеу кезінде ескерілетін ерекшеліктер?", "answer": "Статикалық электрден қорғану үшін антистатикалық білезік тағу керек. Компоненттерді тек жиектерінен ұстау, тоқ сымдарын алдын ала ажырату міндетті."}, {"idx": 11, "q": "Жүйені қалпына келтіру утилитасының жұмыс істеуі үшін дискілік кеңістіктің ең аз мөлшері қандай?", "answer": "Жүйені қалпына келтіру утилитасының жұмыс істеуі үшін кемінде 300 МБ бос дискілік кеңістік қажет."}, {"idx": 12, "q": "Жүйені қалпына келтіру нүктелері дискідегі максималды көлемді қанша алады?", "answer": "Жүйені қалпына келтіру нүктелері дискінің максимум 12% көлемін алады. Бұл көлем толғанда ескі нүктелер автоматты жойылады."}, {"idx": 13, "q": "Жүйені қалпына келтіру нүктелері қандай жағдайларда жасалады?", "answer": "Қалпына келтіру нүктелері жаңа бағдарлама немесе драйвер орнатқанда, жүйелік параметрлер өзгергенде, және апта сайын автоматты түрде жасалады."}, {"idx": 14, "q": "Жүйені қалпына келтіру бағдарламасын пайдаланып менің құжаттарым қалтасынан деректерді қалпына келтіруге бола ма?", "answer": "Жоқ, жүйені қалпына келтіру тек жүйелік файлдарды қалпына келтіреді. 'Менің құжаттарым' қалтасындағы жеке деректерге әсер етпейді."}, {"idx": 15, "q": "Құрылған жүйені қалпына келтіру нүктелері қанша уақыт сақталады?", "answer": "Жүйені қалпына келтіру нүктелері 90 күнге дейін сақталады, немесе диск толып қалғанда ескілері автоматты жойылады."}, {"idx": 16, "q": "Жүйені сәтті қалпына келтіруді жоюға бола ма?", "answer": "Иә, жүйені қалпына келтіргеннен кейін оны жоюға болады. Бірақ бұл операция кері қайтарылмайды."}, {"idx": 17, "q": "HDD контроллеріне не кіреді?", "answer": "HDD контроллеріне кіреді: интерфейс контроллері (SATA/IDE), кэш жады чипі, DSP процессоры, және диск айналу жылдамдығын басқаратын схемалар."}, {"idx": 18, "q": "SMART-ты қалай нөлге айналдыруға болады?", "answer": "SMART деректерін нөлге келтіру арнайы утилиталар арқылы жүзеге асырылады, мысалы HDDScan немесе Victoria. Бірақ бұл физикалық ақауларды жасырады, ұсынылмайды."}, {"idx": 19, "q": "TestDisk көмегімен бүлінген бөлімді қалай қалпына келтіруге болады?", "answer": "TestDisk іске қосып, дискіні таңдап, Analyse → Quick Search → Write командаларын орындау арқылы жойылған бөлімдерді қалпына келтіруге болады."}, {"idx": 20, "q": "Диск кескіндерін сақтау үшін қандай медианы пайдалануға болады?", "answer": "Диск кескіндерін сақтау үшін сыртқы HDD, NAS (желілік диск жады), DVD/Blu-ray дискілері немесе бұлтты сақтау қолданылады."}, {"idx": 21, "q": "Acronis қауіпсіздік аймағы не үшін арналған?", "answer": "Acronis қауіпсіздік аймағы — дискідегі арнайы жасырын бөлім, ол жүйенің сақтық көшірмесін сақтайды және Windows іске қоспай-ақ жүйені қалпына келтіруге мүмкіндік береді."}, {"idx": 22, "q": "Толық және дифференциалды сақтық көшірменің айырмашылығы неде?", "answer": "Толық сақтық көшірме — барлық деректерді толық көшіру. Дифференциалды — соңғы толық көшірмеден бергі өзгерістерді ғана сақтайды, орын аз алады."}, {"idx": 23, "q": "Қосымша және дифференциалды сақтық көшірменің айырмашылығы неде?", "answer": "Қосымша (инкременталды) сақтық көшірме — соңғы кез келген сақтық көшірмеден бергі өзгерістерді сақтайды. Дифференциалды — тек соңғы толық көшірмеден бергі өзгерістерді сақтайды."}, {"idx": 24, "q": "Қандай жағдайларда LiveCD пайдалану қажеттілігі туындайды?", "answer": "LiveCD пайдалану қажеттілігі: Windows жүктелмегенде, вирустарды жүйесіз тазалағанда, деректерді бүлінген жүйеден алып шыққанда, дискіні тексергенде."}, {"idx": 25, "q": "Reatogo конструктор плагиндері не үшін арналған?", "answer": "Reatogo плагиндері LiveCD құрамына қосымша бағдарламалар мен драйверлерді қосуға мүмкіндік береді, мысалы желі картасының драйверлері немесе арнайы утилиталар."}, {"idx": 26, "q": "LiveCD жасау үшін пайдаланушы қандай бағдарламалық жасақтамаға ие болуы керек?", "answer": "LiveCD жасау үшін ISO файлын жазуға арналған бағдарлама керек: Rufus, UltraISO, ImgBurn немесе Nero. Сонымен қатар жазылатын DVD немесе USB флэш-карта қажет."}, {"idx": 27, "q": "ISO файлында не бар?", "answer": "ISO файлы — дискінің толық кескіні, ішінде операциялық жүйе, бағдарламалар, драйверлер және барлық файлдық жүйе құрылымы сақталған бір файл."}, {"idx": 28, "q": "Бағдарлама ДК жинақтау өндірушілерінің веб-мекен-жайларын не үшін көрсетеді?", "answer": "Бағдарлама өндірушілердің сайттарын көрсетеді, себебі соңғы BIOS жаңартулары, драйверлер мен нұсқаулықтарды ресми сайттан ғана алу дұрыс."}, {"idx": 29, "q": "RAID дегеніміз не?", "answer": "RAID (Redundant Array of Independent Disks) — бірнеше физикалық дискіні біріктіріп, жылдамдықты арттыру немесе деректер қауіпсіздігін қамтамасыз ету технологиясы."}, {"idx": 30, "q": "Frujulia және frusinjulia сынақтарының айырмашылығы неде?", "answer": "Бұл екі сынақ диск бетінің әр түрлі аймақтарын тексеруге арналған: Frujulia сызықтық оқуды, frusinjulia кездейсоқ оқу/жазу жылдамдығын тексереді."}, {"idx": 31, "q": "Жергілікті желіні қандай құрылғымен тексеруге болады?", "answer": "Жергілікті желіні тексеру үшін мультиметр, кабель тестері, немесе ping/tracert сияқты бағдарламалық утилиталар қолданылады."}, {"idx": 32, "q": "Кернеуді қалай өлшеуге болады?", "answer": "Кернеуді мультиметр арқылы өлшейді. Мультиметрді вольтметр режиміне қойып, щуптарды өлшенетін нүктелерге тигізеді."}, {"idx": 33, "q": "Амперметр не үшін арналған?", "answer": "Амперметр электр тізбегіндегі ток күшін өлшеуге арналған. Ол тізбекке тізбектей қосылады."}, {"idx": 34, "q": "Жабдықты орнату кезінде қандай қақтығыстар болуы мүмкін?", "answer": "Жабдықты орнату кезінде IRQ қақтығыстары, I/O порт мекенжайлары қақтығысы, DMA арналары қақтығысы болуы мүмкін."}, {"idx": 35, "q": "Аппараттық қақтығыстар бағдарламалық жасақтамадан қалай ерекшеленеді?", "answer": "Аппараттық қақтығыстар физикалық деңгейде ресурстар үшін болады (IRQ, DMA). Бағдарламалық қақтығыстар жадыда немесе процессор уақытын бөлу кезінде туындайды."}, {"idx": 36, "q": "Процессордың қызып кетуіне не себеп болады?", "answer": "Процессор қызып кетуінің себептері: салқындатқыш шаңы, термопасталың кеуіп қалуы, желдеткіштің тоқтауы, корпустың нашар желдетілуі."}, {"idx": 37, "q": "SVT модернизациясы не үшін қажет?", "answer": "SVT модернизациясы өнімділікті арттыру, жаңа бағдарламалармен үйлесімділікті қамтамасыз ету және жабдықтың қызмет ету мерзімін ұзарту үшін қажет."}, {"idx": 38, "q": "Неліктен тапсырмаларды орындау үшін әртүрлі SVT конфигурациясы қажет?", "answer": "Әртүрлі тапсырмалар әртүрлі ресурстар талап етеді: графикалық жұмыс үшін күшті GPU, серверлік жұмыс үшін көп жедел жады, есептеу үшін жылдам процессор қажет."}, {"idx": 39, "q": "Post тақтасы не үшін қажет?", "answer": "POST (Power-On Self Test) тақтасы компьютер жүктелу кезінде аппараттық диагностика кодтарын көрсетеді, ақаудың қай компонентте екенін анықтауға мүмкіндік береді."}, {"idx": 40, "q": "Чиптерді аналық платаға қалай шығаруға және орнатуға болады?", "answer": "Чиптерді аналық платаға орнату үшін арнайы chip-off станциясы немесе жылу пистолеті қолданылады. Алдымен ескі чип қыздырылып алынады, жаңасы дәлдеп орнатылады."}, {"idx": 41, "q": "Автоматтандырылған басқару жүйесі не үшін қажет?", "answer": "Автоматтандырылған басқару жүйесі (АБЖ) — техникалық құрылғылардың жұмысын автоматты бақылауға, деректер жинауға және басқаруға арналған бағдарламалық-аппараттық кешен."}, {"idx": 42, "q": "ДК жүктеу кезінде негізгі бақылау дегеніміз не?", "answer": "ДК жүктелу кезінде негізгі бақылау (POST) — BIOS тарапынан жүргізілетін жабдық тексерісі: процессор, жедел жады, дискілер, бейне карта дұрыс жұмыс істейтінін тексеру."}, {"idx": 43, "q": "Windows ОЖ автоматты түрде қалай қалпына келтіріледі?", "answer": "Windows ОЖ автоматты қалпына келтіруі: жүктеу сәтсіз болғанда Windows автоматты жөндеу режимін іске қосады, жүйе файлдарын тексеріп, қажет болса қалпына келтіреді."}, {"idx": 44, "q": "Сізге қандай диагностикалық жүйелер белгілі?", "answer": "Белгілі диагностикалық жүйелер: AIDA64, CPU-Z, HWMonitor, Memtest86 (жедел жады), Victoria, HDDScan (диск), 3DMark (бейне карта), Prime95 (процессор)."}, {"idx": 45, "q": "Диагностика процесі нені қамтиды?", "answer": "Диагностика процесі: ақауды анықтау → симптомдарды талдау → тексеру жоспарын жасау → жабдық пен бағдарламаны тексеру → ақауды жою → нәтижені тексеру."}, {"idx": 46, "q": "Сіз қанша RAID деңгейін білесіз?", "answer": "RAID деңгейлері: RAID 0 (striping), RAID 1 (mirroring), RAID 2, 3, 4, RAID 5 (паритет), RAID 6 (екі паритет), RAID 10 (1+0), RAID 01 (0+1)."}, {"idx": 47, "q": "RAID 0 кемшілігі неде?", "answer": "RAID 0 кемшілігі — деректер қорғалмайды. Дискілердің біреуі істен шықса, барлық деректер жоғалады, себебі деректер бөліктеніп екі дискіге жазылады."}, {"idx": 48, "q": "RAID 0+1 баламасы қандай?", "answer": "RAID 0+1 баламасы — RAID 10 (1+0) болып табылады. RAID 10 сенімдірек деп саналады, себебі алдымен дискілер айналары жасалып, содан соң striping жасалады."}, {"idx": 49, "q": "RAID 5 құрылымы қандай?", "answer": "RAID 5 кемінде 3 дискіден тұрады. Деректер мен паритет ақпараты барлық дискілерге бөлінеді. Бір диск істен шықса, паритет арқылы деректер қалпына келтіріледі."}, {"idx": 50, "q": "Бесінші деңгейдегі RAID массиві нөлден қалай ерекшеленеді?", "answer": "RAID 5 паритет блоктарын пайдаланады және бір диск бұзылғанда деректерді қалпына келтіре алады. RAID 0 тек жылдамдықты арттырады, деректер қорғалмайды."}, {"idx": 51, "q": "Matrix RAID технологиясы қандай мүмкіндіктерді жүзеге асырады?", "answer": "Matrix RAID — Intel технологиясы, бір RAID массивінде бір уақытта екі RAID деңгейін (мысалы RAID 0 және RAID 1) іске асыруға мүмкіндік береді."}, {"idx": 52, "q": "RAID іске асыру үшін не қолдану керек?", "answer": "RAID іске асыру үшін аппараттық RAID контроллері немесе аналық платаның кіріктірілген RAID контроллері, не болмаса бағдарламалық RAID (ОЖ деңгейінде) қолданылады."}, {"idx": 53, "q": "Деректерді сақтау және сервердің диск ішкі жүйесінің жұмысының сенімділігі мәселесі қалай шешіледі?", "answer": "Мәселе RAID массивтері, резервтік серверлер, деректерді географиялық бөлу, және үнемі сақтық көшірме жасау арқылы шешіледі."}, {"idx": 54, "q": "RAID көмегімен деректерді қалпына келтірудің негізгі әдісі қандай?", "answer": "RAID көмегімен деректерді қалпына келтіру — бүлінген дискіні жаңасымен ауыстырып, массивті қайта құру (rebuild). Контроллер паритет деректері бойынша жоғалған деректерді қалпына келтіреді."}, {"idx": 55, "q": "Бұл SVT нені қамтиды?", "answer": "SVT (санақ-есептеу техникасы) жабдықтарды қамтиды: компьютерлер, серверлер, принтерлер, сканерлер, желілік жабдықтар және олардың жинақтаушылары."}, {"idx": 56, "q": "Орталықтандырылған SVT дегеніміз не?", "answer": "Орталықтандырылған SVT — барлық есептеу қуаты бір орталық серверде шоғырланған жүйе, пайдаланушылар терминалдар арқылы ортақ ресурстарды пайдаланады."}, {"idx": 57, "q": "Ай сайынғы профилактиканың жылдықтан айырмашылығы неде?", "answer": "Ай сайынғы профилактика: шаңды тазалау, байланыстарды тексеру, температураны бақылау. Жылдық профилактика: термопастаны ауыстыру, терең тазалау, барлық компоненттерді толық тексеру."}, {"idx": 58, "q": "Белсенді және пассивті профилактиканың айырмашылықтары қандай?", "answer": "Белсенді профилактика жабдықты үнемі тексеріп, проблема пайда болмай алдын алады. Пассивті профилактика қорғаныш жабдықтары арқылы сыртқы факторлардан қорғайды."}, {"idx": 59, "q": "SVT қызмет көрсету кезінде электростатикалық разрядтар қандай қауіпті?", "answer": "Электростатикалық разряд микросхемалардың ішкі транзисторларын бірден жоя алады. Тіпті 10В-тан аз разряд да CMOS схемаларын зақымдауы мүмкін."}, {"idx": 60, "q": "Профилактикалық қызмет көрсету жиілігі неге байланысты?", "answer": "Профилактика жиілігі жабдықтың орналасқан ортасына байланысты: шаңды, ылғалды немесе өндірістік жерлерде жиірек, таза кеңсе жағдайында сирегірек жүргізіледі."}, {"idx": 61, "q": "Тапсырмалар менеджері дегеніміз не?", "answer": "Тапсырмалар менеджері (Task Manager) — Windows ОЖ-ның іске қосылған процестерді, жүктелуді, жедел жады мен процессор пайдалануды бақылайтын жүйелік утилита."}, {"idx": 62, "q": "Тапсырмалар менеджерін қалай шақыруға болады?", "answer": "Тапсырмалар менеджерін Ctrl+Alt+Delete немесе Ctrl+Shift+Esc пернелер тіркесімімен, немесе тапсырмалар тақтасында тышқанның оң жақ батырмасымен шақыруға болады."}, {"idx": 63, "q": "Тапсырмалар менеджері не үшін қолданылады?", "answer": "Тапсырмалар менеджері процестерді аяқтауға, жүктелуді бақылауға, іске қосылу бағдарламаларын басқаруға және жүйе өнімділігін бақылауға қолданылады."}, {"idx": 64, "q": "Ақпараттық және тестілік бағдарламалар қандай жағдайларда қолданылады?", "answer": "Ақпараттық бағдарламалар жабдық туралы толық мәлімет алу үшін, тестілік бағдарламалар жабдықтың өнімділігін өлшеу және стресс-тест жүргізу үшін қолданылады."}, {"idx": 65, "q": "Жабдықтың еңбек сыйымдылығы неге байланысты?", "answer": "Жабдықтың еңбек сыйымдылығы жабдықтың күрделілігіне, бүлінген бөліктер санына, қажетті аспаптарға, маманның тәжірибесіне және қосалқы бөліктер қолжетімділігіне байланысты."}, {"idx": 66, "q": "Кэш жады дегеніміз не?", "answer": "Кэш жады — процессор мен жедел жады арасындағы өте жылдам аралық жады (SRAM). Жиі пайдаланылатын деректерді уақытша сақтап, процессордың жылдамдығын арттырады."}, {"idx": 67, "q": "Түйінді жөндеу әдісінің мәні неде?", "answer": "Түйінді жөндеу әдісі — ақаулы компонентті тұтасымен ауыстыру. Нақты ақауды іздемей, ықтимал ақаулы блок немесе плата толығымен жаңасымен алмастырылады."}, {"idx": 68, "q": "Процессор дегеніміз не?", "answer": "Процессор (CPU) — компьютердің орталық өңдеу құрылғысы, барлық есептеу операцияларын орындайды, нұсқауларды өңдейді және жүйенің жұмысын үйлестіреді."}, {"idx": 69, "q": "Салқындатқыш дегеніміз не?", "answer": "Салқындатқыш (кулер) — процессор немесе бейне карта сияқты жылу шығаратын компоненттерді суыту үшін қолданылатын желдеткіш пен радиатордан тұратын жүйе."}, {"idx": 70, "q": "Жүйелік тақта дегеніміз не?", "answer": "Жүйелік тақта (аналық плата) — компьютердің барлық компоненттерін біріктіретін негізгі тақта. Оған процессор, жедел жады, карталар және барлық перифериялар қосылады."}, {"idx": 71, "q": "Қатты диск дегеніміз не?", "answer": "Қатты диск (HDD) — магниттік дискілерде деректерді тұрақты сақтайтын жады құрылғысы. Операциялық жүйе, бағдарламалар және файлдар осында сақталады."}, {"idx": 72, "q": "Диск жетегі дегеніміз не?", "answer": "Диск жетегі (дисковод) — ақпарат тасымалдаушыларын (CD, DVD, Blu-ray дискілерін) оқу және жазу үшін арналған оптикалық немесе магниттік құрылғы."}];

function onSearch(){
  const q=document.getElementById('searchInput').value;
  document.getElementById('clearBtn').className=q?'show':'';
  if(!q.trim()){renderResults(questions);document.getElementById('resultCount').textContent='Барлығы: '+questions.length;return;}
  const words=q.trim().toLowerCase().split(/\s+/).filter(w=>w.length>1);
  const scored=questions.map(item=>{
    const text=item.q.toLowerCase();let score=0;
    for(const w of words)if(text.includes(w))score+=(w.length>3?3:1);
    return{...item,score};
  }).filter(i=>i.score>0).sort((a,b)=>b.score-a.score);
  renderResults(scored,words);
  const c=scored.length;
  document.getElementById('resultCount').textContent=c===0?'Табылмады':'Табылды: '+c;
}

function hl(text,words){
  if(!words||!words.length)return text;
  let r=text;
  for(const w of words){const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');r=r.replace(re,'<mark>$1</mark>');}
  return r;
}

function renderResults(items,words){
  const c=document.getElementById('results');
  if(!items.length){c.innerHTML='<div class="empty-state"><div class="big">🔍</div><p>Басқа сөздерді көріп көр</p></div>';return;}
  c.innerHTML=items.map(item=>`
    <div class="result-card" id="card-${item.idx}" onclick="toggleCard(${item.idx})">
      <button class="copy-btn" id="cb-${item.idx}" onclick="copyAns(event,${item.idx})">көшіру</button>
      <div class="q-num">№${item.idx}</div>
      <div class="q-text">${hl(item.q,words)}</div>
      <div class="answer-block">
        <div class="ans-label">✓ Жауап</div>
        <div class="ans-text">${item.answer}</div>
      </div>
    </div>`).join('');
}

function toggleCard(idx){
  const card=document.getElementById('card-'+idx);
  if(!card)return;
  const was=card.classList.contains('expanded');
  document.querySelectorAll('.result-card.expanded').forEach(c=>c.classList.remove('expanded'));
  if(!was)card.classList.add('expanded');
}

function copyAns(e,idx){
  e.stopPropagation();
  const item=questions.find(q=>q.idx===idx);if(!item)return;
  navigator.clipboard.writeText(item.answer).then(()=>{
    const btn=document.getElementById('cb-'+idx);
    btn.textContent='✓ көшірілді';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='көшіру';btn.classList.remove('copied');},1500);
  });
}

function clearSearch(){
  document.getElementById('searchInput').value='';
  document.getElementById('clearBtn').className='';
  renderResults(questions);
  document.getElementById('resultCount').textContent='Барлығы: '+questions.length;
  document.getElementById('searchInput').focus();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')clearSearch();});
renderResults(questions);
</script>
